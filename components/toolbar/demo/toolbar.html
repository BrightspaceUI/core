		<script>
			setTimeout(() => {
				[...document.querySelectorAll('d2l-toolbar-button')].forEach(elem => {
					elem.addEventListener('click', e => console.log(e));
				});
				[...document.querySelectorAll('d2l-toolbar-button-toggle')].forEach(elem => {
					elem.addEventListener('d2l-toolbar-button-toggle-change', e => console.log(e));
				});
			}, 1000);
