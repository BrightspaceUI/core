<!DOCTYPE html>
<html lang="en">
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta charset="UTF-8">
		<link rel="stylesheet" href="../../demo/styles.css" type="text/css">
		<script type="module">
			import '../../state/state-action-button.js';
			import '../../state/state-action-link.js';
			import '../../state/state-illustrated.js';
			import '../empty-state-simple.js';
			import '../../demo/demo-page.js';
		</script>
	</head>
	<body unresolved>

		<d2l-demo-page page-title="d2l-empty-state">

			<h2>Empty State Simple</h2>

			<h5>No Action</h5>
			<d2l-demo-snippet>
				<template>
					<d2l-empty-state-simple description="There are no assignments to display."></d2l-empty-state-simple>
				</template>
			</d2l-demo-snippet>

			<h5>Empty State Action Button</h5>
			<d2l-demo-snippet>
				<template>
					<d2l-empty-state-simple description="There are no assignments to display.">
						<d2l-state-action-button text="Create New Assignment"></d2l-state-action-button>
					</d2l-empty-state-simple>
				</template>
			</d2l-demo-snippet>

			<h5>Empty State Action Link</h5>
			<d2l-demo-snippet>
				<template>
					<d2l-empty-state-simple description="There are no assignments to display.">
						<d2l-state-action-link text="Create New Assignment" href="https://d2l.com"></d2l-state-action-link>
					</d2l-empty-state-simple>
				</template>
			</d2l-demo-snippet>

			<h5>Empty State Action Link + target</h5>
			<d2l-demo-snippet>
				<template>
					<d2l-empty-state-simple description="There are no assignments to display.">
						<d2l-state-action-link text="Create New Assignment" href="https://d2l.com" target="_blank"></d2l-state-action-link>
					</d2l-empty-state-simple>
				</template>
			</d2l-demo-snippet>

			<h5>Empty State Only Button</h5>
			<d2l-demo-snippet>
				<template>
					<d2l-empty-state-simple description="empty state button">
						<d2l-state-action-button text="Create New Assignment"></d2l-state-action-button>
					</d2l-empty-state-simple>
				</template>
			</d2l-demo-snippet>

			<h5>Empty State Only Link</h5>
			<d2l-demo-snippet>
				<template>
					<d2l-empty-state-simple description="empty state link">
						<d2l-state-action-link text="Create New Assignment" href="https://d2l.com"></d2l-state-action-link>
					</d2l-empty-state-simple>
				</template>
			</d2l-demo-snippet>

		</d2l-demo-page>

	</body>
</html>
