name: vdiff
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: write
  pull-requests: write
  statuses: write

jobs:
  vdiff:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: Brightspace/third-party-actions@actions/checkout
      - uses: Brightspace/setup-node@main
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          d2l-registry-token: ${{ secrets.D2L_PACKAGE_REGISTRY_AUTH_TOKEN }}
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: vdiff Tests
        id: vdiff
        uses: BrightspaceUI/actions/vdiff@main
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          test-timeout: 10000
      - name: Upload test report
        if: (!cancelled()) && github.actor != 'dependabot[bot]'
        uses: Brightspace/test-reporting-action@main
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-session-token: ${{secrets.AWS_SESSION_TOKEN}}
      - name: Notify Slack
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: Brightspace/third-party-actions@slackapi/slack-github-action
        with:
          channel-id: "#gaudi-dev-alerts"
          payload: >
            {
              "username": "BrightspaceUI/core Visual Diff Failure",
              "icon_emoji": ":brightspaceui:",
              "unfurl_media": false,
              "unfurl_links": false,
              "text": ":information_source: vdiff job on `main` branch failed. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}${{ env.REPORT_URL && format(' or {0}', env.REPORT_URL) || '' }} for details.",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":information_source: vdiff job on `main` branch failed. See the <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run logs>${{ env.REPORT_URL && format(' or the <{0}|vdiff report>', env.REPORT_URL) || '' }} for details."
                  }
                }
              ]
            }
        env:
          REPORT_URL: ${{ steps.vdiff.outputs.report-url }}
          SLACK_BOT_TOKEN: ${{ secrets.D2L_SLACK_TOKEN }}
